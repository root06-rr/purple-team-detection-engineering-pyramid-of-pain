title: Command Shell Creates File in User Temporary Directory
id: 5c32a6b9-7a21-4e5b-8f4d-1c9a2b6e7d30
status: experimental
description: Detects cmd.exe creating exfiltr8.log in the user's temporary directory. The source screenshot shows the process and file activity, but no raw Sysmon event is available for validation.
author: Rajat Rupam
date: 2026-11-13
references:
  - https://attack.mitre.org/techniques/TA0010/
  - https://attack.mitre.org/techniques/T1074/001/
tags:
  - attack.ta0010
  - attack.exfiltration
  - attack.t1074.001
  - sysmon
logsource:
  category: file_event
  product: windows
detection:
  selection:
    EventID: 11
    Image|endswith: '\cmd.exe'
    TargetFilename|contains: '\AppData\Local\Temp\exfiltr8.log'
  condition: selection
falsepositives:
  - Legitimate command shell activity that creates a file with this name in the user's temporary directory
level: high
