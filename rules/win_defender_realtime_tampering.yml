title: Windows Defender Real-Time Monitoring Disabled via Registry
id: 8b4f3a12-7c91-4d2e-9a14-5f8e2c1b09a1
status: experimental
description: Detects unauthorized modification of the Windows Defender registry key to disable real-time protection (Pyramid of Pain - Host Artifacts).
author: Rajat Rupam
date: 2026-11-13
references:
  - https://attack.mitre.org/techniques/T1562/001/
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    EventID: 13
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows Defender\Real-Time Protection\DisableRealtimeMonitoring'
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
  - Authorized administrative troubleshooting or enterprise AV migration scripts
level: high
